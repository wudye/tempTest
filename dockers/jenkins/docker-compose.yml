version: "3.8"
services:
  jenkins:
    build: .
    ports:
      - "18080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_USER: "admin"
      JENKINS_PASS: "admin"
volumes:
  jenkins_data: